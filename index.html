    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, duration: 800, offset: 100 });
        
        // ==========================================
        // CONFIGURAÇÃO FIREBASE - SINCRONIZAÇÃO REAL
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAKA9O9jCud6pJaP1uNDWDAR0EcMfNbh94",
            authDomain: "brandao-barber.firebaseapp.com",
            databaseURL: "https://brandao-barber-default-rtdb.firebaseio.com",
            projectId: "brandao-barber",
            storageBucket: "brandao-barber.firebasestorage.app",
            messagingSenderId: "37453041082",
            appId: "1:37453041082:web:bd8dd33ae2b8dd59912183"
        };
        
        // Inicializa Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        // Horários fixos
        const horariosFixos = ['09:00','09:30','10:00','10:30','11:00','15:00','15:30','16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30','20:00'];
        
        // Referência aos agendamentos no Firebase
        const agendamentosRef = database.ref('agendamentos');
        
        // Cache local dos agendamentos
        let agendamentosCache = {};
        
        // ==========================================
        // STATUS DE CONEXÃO
        // ==========================================
        const connectionStatus = document.getElementById('connectionStatus');
        const connectedRef = database.ref('.info/connected');
        
        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                connectionStatus.innerHTML = '<i class="fas fa-circle"></i> ONLINE';
                connectionStatus.className = 'connection-status online';
            } else {
                connectionStatus.innerHTML = '<i class="fas fa-circle"></i> OFFLINE';
                connectionStatus.className = 'connection-status offline';
            }
        });
        
        // ==========================================
        // FUNÇÃO: Verifica se um horário é passado
        // ==========================================
        function isHorarioPassado(data, horario) {
            const agora = new Date();
            const [hora, minuto] = horario.split(':');
            const dataHorario = new Date(data + `T${hora}:${minuto}:00`);
            
            // Adiciona 30 minutos de tolerância (tempo do atendimento)
            dataHorario.setMinutes(dataHorario.getMinutes() + 30);
            
            return dataHorario < agora;
        }
        
        // ==========================================
        // FUNÇÃO: Limpa agendamentos passados do Firebase
        // ==========================================
        function limparAgendamentosPassados() {
            const agora = new Date();
            let removidos = 0;
            
            Object.entries(agendamentosCache).forEach(([id, agendamento]) => {
                if (isHorarioPassado(agendamento.data, agendamento.horario)) {
                    // Remove do Firebase
                    agendamentosRef.child(id).remove()
                        .then(() => {
                            removidos++;
                            console.log(`🗑️ Agendamento passado removido: ${agendamento.data} ${agendamento.horario}`);
                        })
                        .catch(error => console.error('Erro ao remover:', error));
                }
            });
            
            if (removidos > 0) {
                console.log(`✅ Total de ${removidos} agendamentos passados removidos`);
            }
        }
        
        // ==========================================
        // ESCUTA EM TEMPO REAL DOS AGENDAMENTOS
        // ==========================================
        agendamentosRef.on('value', (snapshot) => {
            agendamentosCache = snapshot.val() || {};
            console.log('📡 Agendamentos sincronizados:', Object.keys(agendamentosCache).length);
            
            // Limpa agendamentos passados automaticamente
            limparAgendamentosPassados();
            
            // Atualiza os horários se já tiver uma data selecionada
            const dataSelecionada = document.getElementById('data').value;
            if (dataSelecionada) {
                carregarHorarios(dataSelecionada);
                document.getElementById('ultimaAtualizacao').innerHTML = 
                    '<i class="fas fa-check-circle" style="color:#4CAF50;"></i> Atualizado: ' + new Date().toLocaleTimeString('pt-BR');
            }
        });
        
        // ==========================================
        // FUNÇÕES
        // ==========================================
        function getAgendamentosPorData(data) {
            const resultado = [];
            const agora = new Date();
            
            Object.values(agendamentosCache).forEach(agendamento => {
                // Só conta como ocupado se for da data selecionada E não for horário passado
                if (agendamento.data === data && !isHorarioPassado(agendamento.data, agendamento.horario)) {
                    resultado.push(agendamento);
                }
            });
            return resultado;
        }
        
        function carregarHorarios(data) {
            const container = document.getElementById('horariosContainer');
            const loadingEl = document.getElementById('loadingHorarios');
            
            if (!data) {
                container.innerHTML = '<div style="grid-column: span 5; text-align: center; padding: 20px; color: #B0B0B0;">Selecione uma data</div>';
                return;
            }
            
            // Mostra loading
            loadingEl.classList.add('active');
            
            // Pequeno delay para dar feedback visual
            setTimeout(() => {
                const dataObj = new Date(data + 'T12:00:00');
                const diaSemana = dataObj.getDay();
                
                // Verifica se é domingo (0) ou segunda (1)
                if (diaSemana === 0 || diaSemana === 1) {
                    container.innerHTML = '<div style="grid-column: span 5; text-align: center; padding: 20px; color: #C0C0C0; font-size: 18px;">⛔ FECHADO<br><small>Funcionamento: Terça a Sábado</small></div>';
                    loadingEl.classList.remove('active');
                    return;
                }
                
                // Não permite agendar em datas passadas
                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0);
                if (dataObj < hoje) {
                    container.innerHTML = '<div style="grid-column: span 5; text-align: center; padding: 20px; color: #C0C0C0; font-size: 18px;">📅 Data passada<br><small>Selecione uma data futura</small></div>';
                    loadingEl.classList.remove('active');
                    return;
                }
                
                // Pega agendamentos da data selecionada (apenas não passados)
                const agendamentosDoDia = getAgendamentosPorData(data);
                const horariosOcupados = agendamentosDoDia.map(a => a.horario);
                
                // Se for hoje, também marca como indisponível os horários que já passaram
                const hojeStr = new Date().toISOString().split('T')[0];
                
                console.log(`📅 Data: ${data} | Ocupados: ${horariosOcupados.length} | ${horariosOcupados.join(', ')}`);
                
                container.innerHTML = horariosFixos.map(horario => {
                    let ocupado = horariosOcupados.includes(horario);
                    
                    // Se for hoje, verifica se o horário já passou
                    if (data === hojeStr && !ocupado) {
                        ocupado = isHorarioPassado(data, horario);
                    }
                    
                    let status = '';
                    if (ocupado && horariosOcupados.includes(horario)) {
                        status = '🔒';
                    } else if (ocupado) {
                        status = '⏰';
                    }
                    
                    return `<button type="button" class="horario-btn ${ocupado ? 'indisponivel' : 'disponivel'}" 
                        data-horario="${horario}" ${ocupado ? 'disabled' : ''}>
                        ${horario} ${status}
                    </button>`;
                }).join('');
                
                // Adiciona eventos de clique
                document.querySelectorAll('.horario-btn.disponivel').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.horario-btn').forEach(b => b.classList.remove('selecionado'));
                        this.classList.add('selecionado');
                        document.getElementById('horarioSelecionado').value = this.dataset.horario;
                        atualizarResumo();
                    });
                });
                
                loadingEl.classList.remove('active');
            }, 300);
        }
        
        function atualizarResumo() {
            const nome = document.getElementById('nome').value || '—';
            const servico = document.getElementById('servico').selectedOptions[0]?.text || '—';
            const data = document.getElementById('data').value;
            const horario = document.getElementById('horarioSelecionado').value;
            
            document.getElementById('resumoNome').innerText = nome;
            document.getElementById('resumoServico').innerText = servico;
            
            let dataHora = '—';
            if (data && horario) {
                const dataFormatada = new Date(data + 'T12:00:00').toLocaleDateString('pt-BR');
                dataHora = `${dataFormatada} às ${horario}`;
            }
            document.getElementById('resumoDataHora').innerText = dataHora;
        }
        
        function fecharModal() {
            document.getElementById('modalConfirmacao').classList.remove('active');
        }
        
        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        document.addEventListener('DOMContentLoaded', function() {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('data').value = hoje;
            document.getElementById('data').min = hoje;
            
            // Carrega horários iniciais
            setTimeout(() => carregarHorarios(hoje), 800);
            
            // Event listeners
            document.getElementById('data').addEventListener('change', function() {
                document.getElementById('horarioSelecionado').value = '';
                carregarHorarios(this.value);
                atualizarResumo();
            });
            
            document.getElementById('nome').addEventListener('input', atualizarResumo);
            document.getElementById('servico').addEventListener('change', atualizarResumo);
            
            // Botões dos cards de serviço
            document.querySelectorAll('.agendar-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.getElementById('agendamento').scrollIntoView({ behavior: 'smooth' });
                    const select = document.getElementById('servico');
                    const servicoTexto = this.dataset.servico;
                    
                    for (let option of select.options) {
                        if (option.text.includes(servicoTexto)) {
                            select.value = option.value;
                            break;
                        }
                    }
                    atualizarResumo();
                });
            });
            
            // SUBMIT DO FORMULÁRIO
            document.getElementById('bookingForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const dados = {
                    nome: document.getElementById('nome').value.trim(),
                    whatsapp: document.getElementById('whatsapp').value.trim(),
                    servico: document.getElementById('servico').value,
                    data: document.getElementById('data').value,
                    horario: document.getElementById('horarioSelecionado').value,
                    observacoes: document.getElementById('observacoes').value.trim(),
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                };
                
                // Validações
                if (!dados.nome || !dados.whatsapp || !dados.servico || !dados.data || !dados.horario) {
                    alert('⚠️ Preencha todos os campos obrigatórios!');
                    return;
                }
                
                // Verifica dia da semana
                const dataObj = new Date(dados.data + 'T12:00:00');
                const diaSemana = dataObj.getDay();
                if (diaSemana === 0 || diaSemana === 1) {
                    alert('⛔ Barbearia fechada neste dia! Funcionamos de Terça a Sábado.');
                    return;
                }
                
                // Verifica se é data passada
                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0);
                if (dataObj < hoje) {
                    alert('📅 Não é possível agendar em datas passadas!');
                    return;
                }
                
                // Verifica se o horário já passou (para hoje)
                if (isHorarioPassado(dados.data, dados.horario)) {
                    alert('⏰ Este horário já passou! Escolha um horário futuro.');
                    carregarHorarios(dados.data);
                    return;
                }
                
                // Verifica se o horário ainda está disponível
                const agendamentosDoDia = getAgendamentosPorData(dados.data);
                const horarioJaOcupado = agendamentosDoDia.some(a => a.horario === dados.horario);
                
                if (horarioJaOcupado) {
                    alert('⛔ Este horário acabou de ser agendado por outra pessoa! Por favor, escolha outro horário.');
                    carregarHorarios(dados.data);
                    return;
                }
                
                // Salva no Firebase
                const novoAgendamentoRef = agendamentosRef.push();
                novoAgendamentoRef.set(dados)
                    .then(() => {
                        console.log('✅ Agendamento salvo no Firebase!');
                        
                        // Formatar dados para WhatsApp
                        const dataFormatada = new Date(dados.data + 'T12:00:00').toLocaleDateString('pt-BR');
                        const mensagem = `🪒 *NOVO AGENDAMENTO* 🪒%0A%0A` +
                            `👤 *Cliente:* ${dados.nome}%0A` +
                            `📞 *WhatsApp:* ${dados.whatsapp}%0A` +
                            `💈 *Serviço:* ${dados.servico}%0A` +
                            `📅 *Data:* ${dataFormatada}%0A` +
                            `⏰ *Horário:* ${dados.horario}%0A` +
                            `📝 *Obs:* ${dados.observacoes || 'Sem observações'}%0A%0A` +
                            `✅ *AGUARDANDO CONFIRMAÇÃO DO BRANDÃO*`;
                        
                        // Modal de confirmação
                        document.getElementById('modalDetalhes').innerHTML = `
                            <div style="font-size: 20px;">✅ Agendado com sucesso!</div>
                            <div style="color:#C0C0C0; margin: 10px 0;">${dados.servico}</div>
                            <div style="font-size: 22px; margin: 10px 0;">${dataFormatada} • ${dados.horario}</div>
                            <div style="margin-top: 15px; padding: 10px; background: rgba(192,192,192,0.1); border-radius: 5px;">
                                <i class="fab fa-whatsapp" style="color: #25D366; font-size: 20px;"></i>
                                <strong style="color: #C0C0C0;">ENVIE A MENSAGEM NO WHATSAPP</strong>
                                <p style="font-size: 14px; margin-top: 5px;">O Brandão precisa confirmar seu horário!</p>
                            </div>
                        `;
                        document.getElementById('modalConfirmacao').classList.add('active');
                        
                        // Abre WhatsApp
                        window.open(`https://wa.me/5591985601098?text=${mensagem}`, '_blank');
                        
                        // Reset do formulário
                        document.getElementById('horarioSelecionado').value = '';
                        document.getElementById('data').value = hoje.toISOString().split('T')[0];
                        document.getElementById('servico').value = '';
                        document.getElementById('nome').value = '';
                        document.getElementById('whatsapp').value = '';
                        document.getElementById('observacoes').value = '';
                        
                        carregarHorarios(hoje.toISOString().split('T')[0]);
                        atualizarResumo();
                    })
                    .catch((error) => {
                        console.error('❌ Erro ao salvar:', error);
                        alert('Erro ao salvar agendamento. Verifique sua conexão e tente novamente.');
                    });
            });
            
            // Back to top
            document.getElementById('backToTop').addEventListener('click', () => 
                window.scrollTo({ top: 0, behavior: 'smooth' }));
            
            window.addEventListener('scroll', () => 
                document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 300));
            
            // Fechar modal com ESC
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') fecharModal();
            });
            
            // Limpa agendamentos passados a cada 5 minutos
            setInterval(limparAgendamentosPassados, 300000);
            
            console.log('🚀 Sistema pronto! Sincronização em tempo real ativa.');
            console.log('🔄 Agendamentos passados serão removidos automaticamente.');
        });
    </script>
